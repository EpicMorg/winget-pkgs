ShortDescription: Toolbox for easy launching the official Valve SDKs such as Source SDK 2013 SP or MP.
Description: |-
  Universal Valve Toolbox is a launcher for the official Valve SDKs and the tools of Source engine games: pick a game you own on Steam (Source SDK 2013, Half-Life 2, Portal, Team Fortress 2, Left 4 Dead 2, Garry's Mod, Black Mesa, Source Filmmaker and more) and start Hammer, Model Viewer, Faceposer and the other SDK tools, your mod projects and helper apps from one window.

  Engines, tools and addons are JSON files that are easy to extend; modes retail, bundle and dev. Needs a running Steam client. Not affiliated with Valve Corporation.
