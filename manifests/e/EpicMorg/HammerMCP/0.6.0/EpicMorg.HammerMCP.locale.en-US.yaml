ShortDescription: Let AI agents see and edit maps in Valve Hammer Editor - live.
Description: |-
  Hammer-MCP is an MCP (Model Context Protocol) server for Valve Hammer Editor (Source engine), Hammer++ and related editors. It talks to the editor you already have open through the shell channel Valve built into Hammer and through Hammer's own menu commands - no plugins, no patched editor.

  - Create point entities with keyvalues, set keyvalues, rotate and delete entities live, with Hammer's undo
  - Save / undo / redo / Run Map / Check for Problems through menu commands
  - Map knowledge from the saved .vmf: entities, outputs, I/O graph, validation against the game's FGD, asset checks
  - Compile with Hammer's own Run Map sequences, parsed compile log, leak trace

  hammer-mcp is the tray app (pick the Hammer process, Attach, Start; the agent connects over HTTP, localhost by default); hammer-mcp-cli is the same server without UI for MCP clients that start servers themselves (stdio or HTTP). It never injects into game processes.
